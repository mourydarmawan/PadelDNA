<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PadelDNA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --pd-bg:#0A0B0D;--pd-s1:#121417;--pd-s2:#181B1F;--pd-s3:#1F2329;
  --pd-bd:#262B31;--pd-bd2:#363C44;
  --pd-tx:#F5F7FA;--pd-tx2:#9AA3AE;--pd-tx3:#6B7280;--pd-txi:#0A0B0D;
  --pd-brand:#00E28A;--pd-brand2:#22F2A0;--pd-brand-lo:#00A968;
  --pd-brand-g:rgba(0,226,138,0.12);--pd-brand-r:rgba(0,226,138,0.32);
  --pd-accent:#4C8DFF;--pd-accent-g:rgba(76,141,255,0.14);
  --pd-warn:#FFB020;--pd-danger:#FF4D4D;
  --pd-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--pd-bg);color:var(--pd-tx);font-family:'Inter',-apple-system,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--pd-brand);text-decoration:none}
.mono{font-family:var(--pd-mono);font-variant-numeric:tabular-nums}
.hidden{display:none!important}

.shell{max-width:1200px;margin:0 auto;padding:24px}
.navbar{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--pd-bd);background:var(--pd-s1);position:sticky;top:0;z-index:50}
.navbar__brand{font-weight:800;letter-spacing:-0.02em;font-size:18px;display:flex;align-items:center;gap:8px}
.navbar__brand::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pd-brand);box-shadow:0 0 12px var(--pd-brand)}
.navbar__menu{display:flex;align-items:center;gap:16px}
.navbar__link{color:var(--pd-tx2);font-size:13px;font-weight:500;padding:6px 10px;border-radius:6px}
.navbar__link:hover,.navbar__link.active{color:var(--pd-tx);background:var(--pd-s3)}

.card{background:var(--pd-s1);border:1px solid var(--pd-bd);border-radius:14px;padding:24px}
.card__title{font-size:16px;font-weight:600;letter-spacing:-0.01em}
.card__sub{font-size:13px;color:var(--pd-tx2);margin-top:2px}
.card__head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;font-size:13px;font-weight:600;border-radius:10px;border:1px solid transparent;transition:all 180ms cubic-bezier(0.2,0.8,0.2,1);line-height:1}
.btn--primary{background:var(--pd-brand);color:var(--pd-txi)}
.btn--primary:hover{background:var(--pd-brand2)}
.btn--secondary{background:var(--pd-s3);color:var(--pd-tx);border-color:var(--pd-bd)}
.btn--secondary:hover{border-color:var(--pd-bd2)}
.btn--ghost{background:transparent;color:var(--pd-tx2);border-color:var(--pd-bd)}
.btn--ghost:hover{color:var(--pd-tx);border-color:var(--pd-bd2)}
.btn--danger{color:var(--pd-danger);border-color:rgba(255,77,77,0.35)}
.btn--danger:hover{background:rgba(255,77,77,0.08)}
.btn--sm{padding:6px 12px;font-size:12px}
.btn:disabled{opacity:0.4;cursor:not-allowed}

.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;border:1px solid transparent}
.badge--n{background:var(--pd-s3);color:var(--pd-tx2);border-color:var(--pd-bd)}
.badge--ok{background:rgba(0,226,138,0.12);color:var(--pd-brand);border-color:rgba(0,226,138,0.3)}
.badge--w{background:rgba(255,176,32,0.12);color:var(--pd-warn);border-color:rgba(255,176,32,0.3)}
.badge--d{background:rgba(255,77,77,0.12);color:var(--pd-danger);border-color:rgba(255,77,77,0.3)}
.badge--i{background:var(--pd-accent-g);color:var(--pd-accent);border-color:rgba(76,141,255,0.35)}
.badge--b{background:var(--pd-brand-g);color:var(--pd-brand);border-color:var(--pd-brand-r)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}

.input,.select,.textarea{width:100%;background:var(--pd-s2);border:1px solid var(--pd-bd);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--pd-tx);transition:border-color 180ms}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--pd-brand)}
.textarea{min-height:100px;resize:vertical;font-family:inherit}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12px;font-weight:600;color:var(--pd-tx2);letter-spacing:0.05em;text-transform:uppercase}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.grid{display:grid;gap:20px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:900px){.grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.grid-2,.grid-3{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-card{width:100%;max-width:440px;background:var(--pd-s1);border:1px solid var(--pd-bd);border-radius:20px;padding:32px}
.auth-logo{font-weight:800;font-size:24px;letter-spacing:-0.02em;margin-bottom:4px}
.auth-tag{color:var(--pd-tx2);font-size:14px;margin-bottom:24px}
.auth-tabs{display:flex;gap:4px;background:var(--pd-s2);padding:4px;border-radius:10px;margin-bottom:20px}
.auth-tab{flex:1;text-align:center;padding:8px;font-size:13px;font-weight:600;color:var(--pd-tx2);border-radius:6px}
.auth-tab.active{background:var(--pd-s3);color:var(--pd-tx)}
.role-picker{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.role-opt{padding:14px;border:1px solid var(--pd-bd);border-radius:10px;text-align:center;cursor:pointer;transition:all 180ms}
.role-opt:hover{border-color:var(--pd-bd2)}
.role-opt.active{border-color:var(--pd-brand);background:var(--pd-brand-g)}
.role-opt__label{font-weight:600}
.role-opt__desc{font-size:11px;color:var(--pd-tx2);margin-top:2px}
.avatar-upload{display:flex;align-items:center;gap:12px}
.avatar-preview{width:56px;height:56px;border-radius:10px;background:var(--pd-s3);border:1px solid var(--pd-bd);display:grid;place-items:center;font-family:var(--pd-mono);font-size:18px;font-weight:700;color:var(--pd-tx3);overflow:hidden;flex-shrink:0}
.avatar-preview img{width:100%;height:100%;object-fit:cover}

.pcard{position:relative;border-radius:20px;padding:1px;background:linear-gradient(160deg,var(--pd-bd2),var(--pd-bd) 40%,var(--pd-bd));overflow:hidden;max-width:380px;width:100%}
.pcard__inner{position:relative;border-radius:19px;background:radial-gradient(120% 90% at 100% 0%,rgba(0,226,138,0.10) 0%,transparent 55%),radial-gradient(120% 90% at 0% 100%,rgba(76,141,255,0.08) 0%,transparent 50%),var(--pd-s1);padding:20px;display:flex;flex-direction:column;gap:20px;min-height:480px}
.pcard__stripe{position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--pd-brand),transparent 60%)}
.pcard__top{display:flex;align-items:center;justify-content:space-between}
.pcard__id{font-family:var(--pd-mono);font-size:11px;color:var(--pd-tx3);letter-spacing:0.08em}
.pcard__identity{display:flex;align-items:center;gap:16px}
.pcard__avatar{width:64px;height:64px;border-radius:10px;background:var(--pd-s3);border:1px solid var(--pd-bd2);display:grid;place-items:center;font-family:var(--pd-mono);font-size:20px;font-weight:700;color:var(--pd-tx2);flex-shrink:0;overflow:hidden}
.pcard__avatar img{width:100%;height:100%;object-fit:cover}
.pcard__name{font-size:20px;font-weight:700;letter-spacing:-0.02em;line-height:1.1}
.pcard__meta{font-size:13px;color:var(--pd-tx2);margin-top:2px}
.pcard__rating{display:flex;align-items:baseline;gap:8px;padding-top:16px;border-top:1px solid var(--pd-bd)}
.pcard__rv{font-family:var(--pd-mono);font-size:44px;font-weight:700;letter-spacing:-0.03em;line-height:1}
.pcard__rmax{font-family:var(--pd-mono);font-size:14px;color:var(--pd-tx3)}
.pcard__rtier{margin-left:auto;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--pd-brand);font-weight:600}
.pcard__footer{display:flex;justify-content:space-between;align-items:center;font-family:var(--pd-mono);font-size:10px;letter-spacing:0.08em;color:var(--pd-tx3);text-transform:uppercase}
.pcard__mini-radar{flex:1;display:flex;align-items:center;justify-content:center;padding:8px 0}

.radar{position:relative;width:100%;aspect-ratio:1;max-width:340px;margin:0 auto}
.radar svg{width:100%;height:100%;overflow:visible}
.radar__grid{stroke:rgba(255,255,255,0.06);fill:none}
.radar__axis{stroke:rgba(255,255,255,0.06)}
.radar__label{fill:var(--pd-tx3);font-size:10px;font-family:Inter;letter-spacing:0.08em;text-transform:uppercase}
.radar__shape{fill:rgba(0,226,138,0.18);stroke:var(--pd-brand);stroke-width:2;stroke-linejoin:round}
.radar__point{fill:var(--pd-brand)}

.cat{padding:16px;border-radius:10px;background:var(--pd-s2);border:1px solid var(--pd-bd)}
.cat__head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cat__name{font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--pd-tx2)}
.cat__score{font-family:var(--pd-mono);font-size:16px;font-weight:700}
.skill{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:6px 0}
.skill__label{font-size:13px;color:var(--pd-tx2)}
.skill__value{font-family:var(--pd-mono);font-size:13px;font-weight:600}
.meter{height:6px;border-radius:999px;background:var(--pd-s3);overflow:hidden;grid-column:1/-1}
.meter__fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--pd-brand-lo),var(--pd-brand));transition:width 400ms}

.prosim{display:flex;align-items:center;gap:16px;padding:16px;border-radius:10px;background:var(--pd-s2);border:1px solid var(--pd-bd)}
.prosim__avatar{width:56px;height:56px;border-radius:10px;background:var(--pd-s3);display:grid;place-items:center;font-size:20px;color:var(--pd-tx3);border:1px solid var(--pd-bd2);flex-shrink:0;font-family:var(--pd-mono);font-weight:700}
.prosim__meta{flex:1;min-width:0}
.prosim__name{font-weight:600}
.prosim__style{font-size:13px;color:var(--pd-tx2)}
.prosim__match{font-family:var(--pd-mono);font-size:22px;font-weight:700;color:var(--pd-brand)}

.tabs{display:flex;gap:4px;background:var(--pd-s2);padding:4px;border-radius:10px;margin-bottom:16px}
.tab{flex:1;text-align:center;padding:10px;font-size:13px;font-weight:600;color:var(--pd-tx2);border-radius:6px}
.tab.active{background:var(--pd-s3);color:var(--pd-tx)}

.ccomment{padding:20px;border-radius:14px;background:var(--pd-s1);border:1px solid var(--pd-bd);border-top:2px solid var(--pd-brand)}
.ccomment__head{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.ccomment__avatar{width:40px;height:40px;border-radius:999px;background:var(--pd-s3);display:grid;place-items:center;font-weight:700;font-family:var(--pd-mono);color:var(--pd-tx2)}
.ccomment__name{font-weight:600;font-size:13px}
.ccomment__role{font-size:11px;color:var(--pd-tx3)}
.ccomment__quote{font-size:14px;line-height:1.5;font-style:italic;padding-left:16px;border-left:2px solid var(--pd-bd2)}
.ccomment__tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;gap:12px;border:1px dashed var(--pd-bd2);border-radius:14px;background:var(--pd-s1)}
.empty__icon{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;background:var(--pd-s3);color:var(--pd-tx2);font-size:20px}
.empty__title{font-weight:600}
.empty__desc{color:var(--pd-tx2);font-size:13px;max-width:320px}

.list{display:flex;flex-direction:column;gap:12px}
.list-item{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:16px;border-radius:10px;background:var(--pd-s1);border:1px solid var(--pd-bd);cursor:pointer;transition:border-color 180ms}
.list-item:hover{border-color:var(--pd-bd2)}

.toast{position:fixed;bottom:24px;right:24px;background:var(--pd-s2);border:1px solid var(--pd-bd2);border-left:3px solid var(--pd-brand);padding:14px 18px;border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,0.45);font-size:13px;z-index:200;max-width:360px}
.toast--error{border-left-color:var(--pd-danger)}

.spinner{width:18px;height:18px;border:2px solid var(--pd-bd2);border-top-color:var(--pd-brand);border-radius:50%;animation:spin 0.7s linear infinite}
.spinner--lg{width:36px;height:36px;border-width:3px}
@keyframes spin{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,var(--pd-s2) 0%,var(--pd-s3) 50%,var(--pd-s2) 100%);background-size:200% 100%;animation:shim 1.4s infinite linear;border-radius:6px}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}

.reco{padding:20px;border-radius:14px;background:linear-gradient(180deg,rgba(76,141,255,0.06),transparent 40%),var(--pd-s1);border:1px solid var(--pd-bd)}
.reco__head{display:flex;align-items:center;gap:8px;margin-bottom:12px;color:var(--pd-accent);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;font-weight:600}
.reco__title{font-size:16px;font-weight:600;letter-spacing:-0.01em}
.reco__body{color:var(--pd-tx2);font-size:13px;margin-top:8px;line-height:1.5}

.ai-empty{text-align:center;padding:32px 16px;color:var(--pd-tx2);font-size:13px}
.ai-loading{display:flex;flex-direction:column;align-items:center;gap:12px;padding:32px 16px;color:var(--pd-tx2);font-size:13px}
</style>
</head>
<body>

<script>
// ============================================================
// CONFIG — REPLACE THESE 3 VALUES
// ============================================================
const SUPABASE_URL  = 'https://nhlwojvirdriuoagcaxy.supabase.co';
const SUPABASE_ANON = 'sb_publishable_9Wi3r_IZaLfSf3Kkp3H-ng_I_s8r5lC';
const FN_URL        = SUPABASE_URL + '/functions/v1/ai-review';
// ============================================================

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON);
const root = document.getElementById('root') || document.body;

// Create #root if missing
if (!document.getElementById('root')) {
  const r = document.createElement('div');
  r.id = 'root';
  document.body.appendChild(r);
}

// ===== STATE =====
const state = {
  user: null,
  profile: null,
  route: 'auth',
  params: {}
};

// ===== HELPERS =====
function $(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstChild;
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmt(n, d = 2) { return n == null ? '—' : Number(n).toFixed(d); }
function initials(name) {
  return (name || '?').split(' ').filter(Boolean).map(s => s[0]).slice(0, 2).join('').toUpperCase() || '?';
}
function toast(msg, isErr = false) {
  const el = $(`<div class="toast ${isErr ? 'toast--error' : ''}">${esc(msg)}</div>`);
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3800);
}

// ===== SUPABASE HELPERS =====
async function fetchProfile() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) return null;
  const { data } = await sb.from('profiles').select('*').eq('id', user.id).single();
  return data;
}

async function uploadAvatar(file, userId) {
  const ext = file.name.split('.').pop();
  const path = `${userId}/avatar_${Date.now()}.${ext}`;
  const { error } = await sb.storage.from('avatars').upload(path, file, { upsert: true });
  if (error) throw error;
  const { data } = sb.storage.from('avatars').getPublicUrl(path);
  return data.publicUrl;
}

// ===== RENDER =====
function render() {
  document.body.innerHTML = '';
  const r = document.createElement('div');
  r.id = 'root';
  document.body.appendChild(r);

  if (state.route === 'auth') r.appendChild(viewAuth());
  else if (state.route === 'dashboard') r.appendChild(viewDashboard());
  else if (state.route === 'coach') r.appendChild(viewCoachDashboard());
  else if (state.route === 'rate') r.appendChild(viewRatePlayer());
  else r.appendChild(viewAuth());
}

function navigate(route, params = {}) {
  state.route = route;
  state.params = params;
  render();
}

// ===== NAVBAR =====
function viewNavbar() {
  const p = state.profile || {};
  const isCoach = p.role === 'coach';
  const el = $(`
  <div class="navbar">
    <div class="navbar__brand">PadelDNA</div>
    <div class="navbar__menu">
      <div class="navbar__link active" data-nav="dashboard">Dashboard</div>
      ${isCoach ? '<div class="navbar__link" data-nav="coach">Roster</div>' : ''}
      <div class="row" style="gap:8px">
        <div class="avatar-preview" style="width:32px;height:32px;font-size:12px">
          ${p.avatar_url ? `<img src="${esc(p.avatar_url)}">` : initials(p.full_name)}
        </div>
        <button class="btn btn--ghost btn--sm" id="logout-btn">Sign Out</button>
      </div>
    </div>
  </div>`);
  el.querySelectorAll('[data-nav]').forEach(x => {
    x.addEventListener('click', () => navigate(x.dataset.nav));
  });
  el.querySelector('#logout-btn').addEventListener('click', async () => {
    await sb.auth.signOut();
    state.user = null; state.profile = null;
    navigate('auth');
  });
  return el;
}

// ===== AUTH VIEW =====
function viewAuth() {
  const el = $(`
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">PadelDNA</div>
      <div class="auth-tag">Technical identity for padel players.</div>
      <div class="auth-tabs">
        <div class="auth-tab active" data-tab="login">Sign In</div>
        <div class="auth-tab" data-tab="signup">Sign Up</div>
      </div>
      <form id="auth-form"></form>
    </div>
  </div>`);

  let mode = 'login';
  let role = 'player';
  let avatarFile = null;

  const form = el.querySelector('#auth-form');
  const tabs = el.querySelectorAll('.auth-tab');

  tabs.forEach(t => t.addEventListener('click', () => {
    tabs.forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    mode = t.dataset.tab;
    renderForm();
  }));

  function renderForm() {
    if (mode === 'login') {
      form.innerHTML = `
        <div class="field"><label>Email</label><input class="input" type="email" name="email" required autocomplete="email"></div>
        <div class="field"><label>Password</label><input class="input" type="password" name="password" required autocomplete="current-password"></div>
        <button class="btn btn--primary" style="width:100%" type="submit">Sign In</button>
      `;
    } else {
      form.innerHTML = `
        <div class="field"><label>Full Name</label><input class="input" name="full_name" required></div>
        <div class="field"><label>Email</label><input class="input" type="email" name="email" required autocomplete="email"></div>
        <div class="field"><label>Password</label><input class="input" type="password" name="password" required minlength="6" autocomplete="new-password"></div>
        <div class="field">
          <label>Role</label>
          <div class="role-picker">
            <div class="role-opt active" data-role="player">
              <div class="role-opt__label">Player</div>
              <div class="role-opt__desc">Track your DNA</div>
            </div>
            <div class="role-opt" data-role="coach">
              <div class="role-opt__label">Coach</div>
              <div class="role-opt__desc">Rate & guide players</div>
            </div>
          </div>
        </div>
        <div class="field">
          <label>Avatar (optional)</label>
          <div class="avatar-upload">
            <div class="avatar-preview" id="av-preview">?</div>
            <input type="file" id="av-input" accept="image/*" style="display:none">
            <button type="button" class="btn btn--ghost btn--sm" id="av-btn">Choose Image</button>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>Position</label>
            <select class="select" name="position">
              <option value="">—</option>
              <option value="drive">Drive</option>
              <option value="backhand">Backhand</option>
              <option value="both">Both</option>
            </select>
          </div>
          <div class="field"><label>Side</label>
            <select class="select" name="side">
              <option value="">—</option>
              <option value="left">Left</option>
              <option value="right">Right</option>
            </select>
          </div>
        </div>
        <div class="field"><label>Handedness</label>
          <select class="select" name="handedness">
            <option value="">—</option>
            <option value="right">Right-handed</option>
            <option value="left">Left-handed</option>
          </select>
        </div>
        <button class="btn btn--primary" style="width:100%" type="submit">Create Account</button>
      `;

      form.querySelectorAll('.role-opt').forEach(o => {
        o.addEventListener('click', () => {
          form.querySelectorAll('.role-opt').forEach(x => x.classList.remove('active'));
          o.classList.add('active');
          role = o.dataset.role;
        });
      });

      const avInput = form.querySelector('#av-input');
      const avPreview = form.querySelector('#av-preview');
      form.querySelector('#av-btn').addEventListener('click', () => avInput.click());
      avInput.addEventListener('change', () => {
        avatarFile = avInput.files[0];
        if (!avatarFile) return;
        const reader = new FileReader();
        reader.onload = e => { avPreview.innerHTML = `<img src="${e.target.result}">`; };
        reader.readAsDataURL(avatarFile);
      });
    }

    form.querySelectorAll('input').forEach(i => {
      i.addEventListener('input', () => i.style.borderColor = '');
    });
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = form.querySelector('button[type="submit"]');
    const fd = new FormData(form);
    const email = String(fd.get('email') || '').trim();
    const password = String(fd.get('password') || '');

    btn.disabled = true;
    btn.innerHTML = '<div class="spinner"></div>';

    try {
      if (mode === 'login') {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        state.user = (await sb.auth.getUser()).data.user;
        state.profile = await fetchProfile();
        if (!state.profile) throw new Error('Profile missing. Please sign up again.');
        toast('Signed in');
        navigate('dashboard');
      } else {
        const meta = {
          role,
          full_name: fd.get('full_name'),
          position: fd.get('position') || null,
          side: fd.get('side') || null,
          handedness: fd.get('handedness') || null
        };
        const { data, error } = await sb.auth.signUp({
          email, password,
          options: { data: meta }
        });
        if (error) throw error;

        // If session exists (email confirm disabled), update profile fields
        if (data.session) {
          state.user = data.user;
          state.profile = await fetchProfile();
          // Upload avatar if provided
          if (avatarFile && state.profile) {
            try {
              const url = await uploadAvatar(avatarFile, state.user.id);
              await sb.from('profiles').update({ avatar_url: url }).eq('id', state.user.id);
              state.profile.avatar_url = url;
            } catch (e) { console.warn('Avatar upload failed', e); }
          }
          toast('Account created');
          navigate('dashboard');
        } else {
          toast('Check your email to confirm your account', false);
          tabs.forEach(x => x.classList.remove('active'));
          tabs[0].classList.add('active');
          mode = 'login';
          renderForm();
        }
      }
    } catch (err) {
      toast(err.message || 'Auth failed', true);
      btn.disabled = false;
      btn.textContent = mode === 'login' ? 'Sign In' : 'Create Account';
    }
  });

  renderForm();
  return el;
}
</script>
<script>
// ============================================================
// DASHBOARD — Player view
// ============================================================

const CATEGORIES = [
  { key: 'power',    label: 'Power',    color: '#FF6B4A' },
  { key: 'control',  label: 'Control',  color: '#4C8DFF' },
  { key: 'attack',   label: 'Attack',   color: '#00E28A' },
  { key: 'defense',  label: 'Defense',  color: '#8B5CF6' },
  { key: 'mental',   label: 'Mental',   color: '#FFB020' },
  { key: 'strategy', label: 'Strategy', color: '#06B6D4' },
];

const SUB_SKILLS = {
  power:    ['Smash Power', 'Serve Speed', 'Overhead'],
  control:  ['Placement', 'Consistency', 'Error Rate'],
  attack:   ['Smash', 'Chiquita', 'Vibora'],
  defense:  ['Lob', 'Return', 'Block'],
  mental:   ['Focus', 'Composure', 'Clutch'],
  strategy: ['Positioning', 'Shot Selection', 'Partnering'],
};

async function loadLatestAssessment(playerId) {
  // Latest coach assessment
  const { data: coachAssess } = await sb
    .from('assessments')
    .select('*, category_scores(*), sub_skill_scores(*)')
    .eq('player_id', playerId)
    .eq('source', 'coach')
    .order('created_at', { ascending: false })
    .limit(1)
    .maybeSingle();

  // Latest AI assessment
  const { data: aiAssess } = await sb
    .from('assessments')
    .select('*, category_scores(*), sub_skill_scores(*)')
    .eq('player_id', playerId)
    .eq('source', 'ai')
    .order('created_at', { ascending: false })
    .limit(1)
    .maybeSingle();

  // Latest AI review (narrative)
  const { data: aiReview } = await sb
    .from('ai_reviews')
    .select('*')
    .eq('player_id', playerId)
    .order('created_at', { ascending: false })
    .limit(1)
    .maybeSingle();

  // Coach comments
  const { data: comments } = await sb
    .from('coach_comments')
    .select('*, coach:coach_id(full_name, avatar_url)')
    .eq('player_id', playerId)
    .order('created_at', { ascending: false });

  return { coachAssess, aiAssess, aiReview, comments: comments || [] };
}

function extractScores(assessment) {
  const out = { categories: {}, subSkills: {} };
  if (!assessment) return out;
  (assessment.category_scores || []).forEach(c => {
    out.categories[c.category] = Number(c.score);
  });
  (assessment.sub_skill_scores || []).forEach(s => {
    if (!out.subSkills[s.category]) out.subSkills[s.category] = {};
    out.subSkills[s.category][s.skill] = Number(s.score);
  });
  return out;
}

function overallFromCategories(cats) {
  const vals = Object.values(cats).filter(v => Number.isFinite(v));
  if (!vals.length) return null;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}

// Rating tier from 0-10 → DUPR 1.00-7.00
function toDUPR(avg10) {
  if (avg10 == null) return null;
  // Map 0-10 to 1.00-7.00
  const v = 1 + (avg10 / 10) * 6;
  return Math.max(1, Math.min(7, v));
}

function tierLabel(dupr) {
  if (dupr == null) return { label: 'Unrated', color: 'var(--pd-tx3)' };
  if (dupr >= 6.0) return { label: 'Elite', color: '#FFB020' };
  if (dupr >= 4.5) return { label: 'Advanced', color: '#00E28A' };
  if (dupr >= 3.0) return { label: 'Intermediate', color: '#4C8DFF' };
  if (dupr >= 1.5) return { label: 'Developing', color: '#9AA3AE' };
  return { label: 'Beginner', color: '#6B7280' };
}

// ===== Player card component =====
function renderPlayerCard(profile, scores, dupr) {
  const cats = scores.categories || {};
  const avg = overallFromCategories(cats);
  const duprVal = dupr ?? toDUPR(avg);
  const tier = tierLabel(duprVal);
  const posLine = [
    profile.handedness === 'left' ? 'Left-handed' : profile.handedness === 'right' ? 'Right-handed' : null,
    profile.side ? profile.side[0].toUpperCase() + profile.side.slice(1) + ' side' : null,
    profile.position ? profile.position[0].toUpperCase() + profile.position.slice(1) : null
  ].filter(Boolean).join(' · ') || 'Profile incomplete';

  return `
  <div class="pcard">
    <div class="pcard__inner">
      <div class="pcard__stripe"></div>
      <div class="pcard__top">
        <span class="pcard__id mono">PDNA-${(profile.id || '').slice(0,4).toUpperCase()}</span>
        ${avg == null
          ? '<span class="badge badge--n">Not Assessed</span>'
          : `<span class="badge badge--b"><span class="dot"></span>${tier.label}</span>`}
      </div>
      <div class="pcard__identity">
        <div class="pcard__avatar">
          ${profile.avatar_url
            ? `<img src="${esc(profile.avatar_url)}" alt="">`
            : initials(profile.full_name)}
        </div>
        <div style="min-width:0">
          <div class="pcard__name">${esc(profile.full_name || 'Unnamed Player')}</div>
          <div class="pcard__meta">${esc(posLine)}</div>
        </div>
      </div>
      <div class="pcard__mini-radar">
        ${avg == null
          ? '<div style="color:var(--pd-tx3);font-size:12px;text-align:center">Awaiting first assessment</div>'
          : renderRadarSVG(cats, 100, 120, true)}
      </div>
      <div class="pcard__rating">
        <span class="pcard__rv" style="${duprVal == null ? 'color:var(--pd-tx3)' : ''}">
          ${duprVal == null ? '—' : duprVal.toFixed(2)}
        </span>
        <span class="pcard__rmax">/7.00</span>
        <span class="pcard__rtier" style="color:${tier.color}">${tier.label}</span>
      </div>
      <div class="pcard__footer">
        <span>PadelDNA</span>
        <span>DUPR-style</span>
      </div>
    </div>
  </div>`;
}

// ===== Radar SVG (parameterized) =====
function renderRadarSVG(scores, size = 240, maxRadius = 80, compact = false) {
  const cx = 100, cy = 100, r = maxRadius;
  const keys = CATEGORIES.map(c => c.key);
  const labels = compact ? [] : CATEGORIES.map(c => c.label);
  const angle = (i) => (Math.PI * 2 * i / keys.length) - Math.PI / 2;
  const pt = (i, val) => {
    const a = angle(i);
    const rr = (Math.max(0, Math.min(10, val)) / 10) * r;
    return [cx + Math.cos(a) * rr, cy + Math.sin(a) * rr];
  };
  const grid = [20, 40, 60, 80].filter(x => x <= r).map(rr =>
    `<circle cx="${cx}" cy="${cy}" r="${rr}" class="radar__grid"/>`).join('');
  const axes = keys.map((_, i) => {
    const [x, y] = pt(i, 10);
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" class="radar__axis"/>`;
  }).join('');
  const points = keys.map((k, i) => pt(i, scores[k] ?? 0));
  const poly = points.map(p => p.join(',')).join(' ');
  const dots = points.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="2.5" class="radar__point"/>`).join('');
  const lbls = labels.map((lb, i) => {
    const a = angle(i);
    const lx = cx + Math.cos(a) * (r + 22);
    const ly = cy + Math.sin(a) * (r + 22);
    let anchor = 'middle';
    if (Math.cos(a) > 0.3) anchor = 'start';
    if (Math.cos(a) < -0.3) anchor = 'end';
    return `<text class="radar__label" x="${lx}" y="${ly + 4}" text-anchor="${anchor}">${lb}</text>`;
  }).join('');
  const vb = compact ? '-20 -20 240 240' : '-40 -40 280 280';
  return `<div class="radar" style="max-width:${size}px">
    <svg viewBox="${vb}">${grid}${axes}<polygon class="radar__shape" points="${poly}"/>${dots}${lbls}</svg>
  </div>`;
}

// ===== Dashboard view =====
function viewDashboard() {
  const el = $(`
  <div>
    <div id="nav-slot"></div>
    <div class="shell" id="content">
      <div class="ai-loading" style="padding:80px">
        <div class="spinner spinner--lg"></div>
        <div>Loading your profile…</div>
      </div>
    </div>
  </div>`);

  el.querySelector('#nav-slot').appendChild(viewNavbar());
  loadDashboard(el.querySelector('#content'));
  return el;
}

async function loadDashboard(container) {
  const profile = state.profile;
  if (!profile) { navigate('auth'); return; }

  const { coachAssess, aiAssess, aiReview, comments } = await loadLatestAssessment(profile.id);
  const coachScores = extractScores(coachAssess);
  const aiScores = extractScores(aiAssess);

  // Prefer AI scores if they exist (AI supersedes coach per spec)
  const activeScores = Object.keys(aiScores.categories).length ? aiScores : coachScores;
  const activeAssess = Object.keys(aiScores.categories).length ? aiAssess : coachAssess;

  const avg = overallFromCategories(activeScores.categories);
  const dupr = activeAssess?.reclub_rating ? Number(activeAssess.reclub_rating) : toDUPR(avg);

  container.innerHTML = '';
  container.appendChild(renderDashboardBody(profile, activeScores, dupr, aiReview, comments, !!coachAssess, !!aiAssess));
}

function renderDashboardBody(profile, scores, dupr, aiReview, comments, hasCoach, hasAI) {
  const wrap = $(`<div class="stack" style="gap:32px"></div>`);

  // Header
  wrap.appendChild($(`
    <div class="row" style="justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px">
      <div>
        <div style="font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--pd-tx3);font-weight:600">Player Dashboard</div>
        <h1 style="font-size:32px;font-weight:800;letter-spacing:-0.03em;margin-top:6px">
          Welcome back${profile.full_name ? ', ' + esc(profile.full_name.split(' ')[0]) : ''}
        </h1>
      </div>
      <div class="row" style="gap:8px">
        ${hasCoach ? '<span class="badge badge--ok"><span class="dot"></span>Coach Assessed</span>' : ''}
        ${hasAI ? '<span class="badge badge--i"><span class="dot"></span>AI Assessed</span>' : ''}
        ${!hasCoach && !hasAI ? '<span class="badge badge--w">Awaiting First Assessment</span>' : ''}
      </div>
    </div>
  `));

  // ----- Row 1: Player card -----
  const row1 = $(`<div class="grid grid-2" style="align-items:start"></div>`);
  row1.appendChild($(`<div>${renderPlayerCard(profile, scores, dupr)}</div>`));

  // Right side: Rating summary
  const catList = CATEGORIES.map(c => {
    const v = scores.categories[c.key];
    return `
      <div class="row" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--pd-bd)">
        <span style="font-size:13px;color:var(--pd-tx2)">${c.label}</span>
        <span class="mono" style="font-weight:600">${v == null ? '—' : Number(v).toFixed(1)}</span>
      </div>`;
  }).join('');

  row1.appendChild($(`
    <div class="card">
      <div class="card__head">
        <div>
          <div class="card__title">Rating Breakdown</div>
          <div class="card__sub">Six core categories · 0–10 scale</div>
        </div>
        <div style="text-align:right">
          <div class="mono" style="font-size:32px;font-weight:700;line-height:1">${dupr == null ? '—' : dupr.toFixed(2)}</div>
          <div style="font-size:11px;color:var(--pd-tx3);letter-spacing:0.1em;text-transform:uppercase">DUPR / 7.00</div>
        </div>
      </div>
      ${catList}
    </div>
  `));
  wrap.appendChild(row1);

  // ----- Row 2: Technical DNA -----
  const row2 = $(`<div class="card"></div>`);
  row2.innerHTML = `
    <div class="card__head">
      <div>
        <div class="card__title">Technical DNA</div>
        <div class="card__sub">Composite radar across 6 core categories</div>
      </div>
      ${Object.keys(scores.categories).length ? '' : '<span class="badge badge--w">No Data</span>'}
    </div>
    ${Object.keys(scores.categories).length
      ? renderRadarSVG(scores.categories, 340, 80, false)
      : '<div class="empty"><div class="empty__icon">◇</div><div class="empty__title">No DNA profile yet</div><div class="empty__desc">Complete an assessment to generate your radar.</div></div>'}
  `;
  wrap.appendChild(row2);

  // ----- Row 3: Attack + Defense breakdown -----
  const row3 = $(`<div class="grid grid-2"></div>`);
  ['attack', 'defense'].forEach(catKey => {
    const cat = CATEGORIES.find(c => c.key === catKey);
    const skills = SUB_SKILLS[catKey];
    const subScores = scores.subSkills[catKey] || {};
    const catScore = scores.categories[catKey];

    const skillsHtml = skills.map(s => {
      const v = subScores[s];
      const pct = v == null ? 0 : (v / 10) * 100;
      return `
        <div class="skill">
          <span class="skill__label">${s}</span>
          <span class="skill__value">${v == null ? '—' : Number(v).toFixed(1)}</span>
          <div class="meter"><div class="meter__fill" style="width:${pct}%;background:linear-gradient(90deg,${cat.color}55,${cat.color})"></div></div>
        </div>`;
    }).join('');

    row3.appendChild($(`
      <div class="cat">
        <div class="cat__head">
          <span class="cat__name" style="color:${cat.color}">${cat.label}</span>
          <span class="cat__score mono">${catScore == null ? '—' : Number(catScore).toFixed(1)}</span>
        </div>
        ${skillsHtml}
      </div>
    `));
  });
  wrap.appendChild($(`<div><div class="card__title" style="margin-bottom:12px">Skill Breakdown</div></div>`));
  wrap.appendChild(row3);

  // ----- Row 4: Pro Similarity -----
  const row4 = $(`<div class="card"></div>`);
  const simMatches = aiReview?.similarity_json?.matches || [];
  row4.innerHTML = `
    <div class="card__head">
      <div>
        <div class="card__title">Pro Similarity</div>
        <div class="card__sub">Your DNA matched against the reference pro database</div>
      </div>
      ${simMatches.length ? '<span class="badge badge--i">AI Generated</span>' : ''}
    </div>
    ${simMatches.length
      ? simMatches.map(m => `
        <div class="prosim" style="margin-bottom:12px">
          <div class="prosim__avatar">${initials(m.name)}</div>
          <div class="prosim__meta">
            <div class="prosim__name">${esc(m.name)}</div>
            <div class="prosim__style">${esc(m.playstyle || m.position || '')}${m.nationality ? ' · ' + esc(m.nationality) : ''}</div>
          </div>
          <div class="prosim__match">${Math.round(m.similarity)}%</div>
        </div>`).join('')
      : '<div class="empty"><div class="empty__icon">◈</div><div class="empty__title">No similarity data yet</div><div class="empty__desc">Run an AI review to see which pros you most resemble.</div></div>'}
  `;
  wrap.appendChild(row4);

  // ----- Row 5: AI Review + Coach Review tabs -----
  const row5 = $(`<div></div>`);
  const tabsEl = $(`
    <div>
      <div class="tabs">
        <div class="tab active" data-tab="ai">AI Review</div>
        <div class="tab" data-tab="coach">Coach Review</div>
      </div>
      <div id="tab-content"></div>
    </div>`);
  const tabContent = tabsEl.querySelector('#tab-content');

  function showAITab() {
    const hasReview = aiReview?.review_text;
    tabContent.innerHTML = `
      <div class="card">
        <div class="card__head">
          <div>
            <div class="card__title">AI Performance Review</div>
            <div class="card__sub">Generated by Gemini based on your DNA</div>
          </div>
          <button class="btn btn--primary btn--sm" id="ai-btn">
            ${hasReview ? 'Re-run AI Review' : 'Generate AI Review'}
          </button>
        </div>
        <div id="ai-body">
          ${hasReview
            ? `<div class="reco"><div class="reco__head">◆ AI Assessment</div><div class="reco__body" style="white-space:pre-wrap">${esc(aiReview.review_text)}</div></div>`
            : '<div class="ai-empty">No AI review yet. Click "Generate AI Review" to analyze your DNA, suggest adjustments, and find your pro match.</div>'}
        </div>
      </div>`;
    tabContent.querySelector('#ai-btn').addEventListener('click', runAIReview);
  }

  function showCoachTab() {
    if (!comments.length) {
      tabContent.innerHTML = `
        <div class="card">
          <div class="empty">
            <div class="empty__icon">👤</div>
            <div class="empty__title">No coach feedback yet</div>
            <div class="empty__desc">Your coach's assessment and comments will appear here.</div>
          </div>
        </div>`;
      return;
    }
    tabContent.innerHTML = `<div class="stack"></div>`;
    const stack = tabContent.querySelector('.stack');
    comments.forEach(c => {
      const tags = (c.tags || []).map(t => `<span class="badge badge--b">${esc(t)}</span>`).join('');
      stack.appendChild($(`
        <div class="ccomment">
          <div class="ccomment__head">
            <div class="ccomment__avatar">${initials(c.coach?.full_name || 'Coach')}</div>
            <div>
              <div class="ccomment__name">${esc(c.coach?.full_name || 'Coach')}</div>
              <div class="ccomment__role">Coach · ${new Date(c.created_at).toLocaleDateString()}</div>
            </div>
          </div>
          <div class="ccomment__quote">${esc(c.body)}</div>
          ${tags ? `<div class="ccomment__tags">${tags}</div>` : ''}
        </div>
      `));
    });
  }

  tabsEl.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      tabsEl.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      if (t.dataset.tab === 'ai') showAITab(); else showCoachTab();
    });
  });

  showAITab();
  row5.appendChild(tabsEl);
  wrap.appendChild(row5);

  return wrap;
}

// ===== AI Review call =====
async function runAIReview() {
  const btn = document.querySelector('#ai-btn');
  const body = document.querySelector('#ai-body');
  if (!btn || !body) return;

  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div> Running…';
  body.innerHTML = `
    <div class="ai-loading">
      <div class="spinner spinner--lg"></div>
      <div>Analyzing your DNA against the pro database…</div>
      <div style="font-size:11px;color:var(--pd-tx3)">This usually takes 5–15 seconds</div>
    </div>`;

  try {
    const { data: { session } } = await sb.auth.getSession();
    const res = await fetch(FN_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${session.access_token}`
      },
      body: JSON.stringify({ player_id: state.profile.id })
    });

    if (!res.ok) {
      const errText = await res.text();
      throw new Error(errText || `AI review failed (${res.status})`);
    }
    const result = await res.json();
    toast('AI review complete');
    // Reload dashboard
    await loadDashboard(document.querySelector('#content'));
  } catch (err) {
    console.error(err);
    toast(err.message || 'AI review failed', true);
    body.innerHTML = `<div class="empty"><div class="empty__icon">×</div><div class="empty__title">AI review failed</div><div class="empty__desc">${esc(err.message)}</div></div>`;
    btn.disabled = false;
    btn.textContent = 'Retry';
  }
}

// ============================================================
// PLACEHOLDER — coach dashboard & rate page come in Drop 4
// ============================================================
function viewCoachDashboard() {
  return $(`<div><div class="shell"><div class="empty"><div class="empty__title">Coach dashboard</div><div class="empty__desc">Coming in Drop 4.</div></div></div></div>`);
}
function viewRatePlayer() {
  return $(`<div><div class="shell"><div class="empty"><div class="empty__title">Rate player</div><div class="empty__desc">Coming in Drop 4.</div></div></div></div>`);
}

// ============================================================
// BOOT
// ============================================================
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    state.user = session.user;
    state.profile = await fetchProfile();
    navigate('dashboard');
  } else {
    navigate('auth');
  }
  sb.auth.onAuthStateChange((evt) => {
    if (evt === 'SIGNED_OUT') {
      state.user = null;
      state.profile = null;
      navigate('auth');
    }
  });
